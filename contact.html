<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us - Online Calculator</title>

<meta name="description" content="Contact Online Calculator for feedback, suggestions and questions.">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fa;
    color:#222;
}

header{
    background:linear-gradient(135deg,#1565c0,#42a5f5);
    color:white;
    text-align:center;
    padding:35px 15px;
}

header h1{
    margin:0 0 10px;
}

.container{
    max-width:800px;
    margin:30px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    height:150px;
    resize:vertical;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#1565c0;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

.info{
    margin-bottom:25px;
    line-height:1.7;
}

footer{
    margin-top:30px;
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<header>
    <h1>Contact Us</h1>
    <p>Online Calculator</p>
</header>

<div class="container">

<div class="card">

<div class="info">

<h2>Get in Touch</h2>

<p>
We welcome your feedback, suggestions and questions.
If you find an error or have an idea to improve our calculators,
please let us know.
</p>

<p>
You can use the form below to send us your message.
</p>

</div>

<form onsubmit="sendMessage(event)">

<label>Your Name</label>
<input type="text" id="name" placeholder="Enter your name" required>

<label>Your Email</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label>Your Message</label>
<textarea id="message" placeholder="Write your message..." required></textarea>

<button type="submit">Send Message</button>

</form>

<div id="result" style="margin-top:15px;"></div>

</div>

</div>

<footer>
    © 2026 Online Calculator. All Rights Reserved.
</footer>

<script>

function sendMessage(event){

    event.preventDefault();

    document.getElementById("result").innerHTML =
    "<p style='color:green;font-weight:bold;'>Thank you for your message!</p>" +
    "<p style='font-size:14px;'>This contact form is currently a demo form. " +
    "Email delivery will be connected later.</p>";

}

</script>

</body>
</html>
